# Only the local names reach the UI and the API: a foreign Host (DNS
# rebinding) is dropped before it can pass the backend's origin check.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /ingest.html {
        return 302 "/#view=ingest";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 5001m;
        # Stream uploads to the backend, which checks the size limits early;
        # buffering first wrote gigabytes to nginx's temp disk (H-13).
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
