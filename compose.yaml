services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5188}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
    # Includes OPENALEX_API_KEY and OPENALEX_MAILTO for server-side requests.
    env_file: .env
    environment:
      LCTREND_SETTINGS_FILE: /app/artifacts/ingestion/settings.env
      HF_HOME: /app/model-cache/huggingface
      TORCH_HOME: /app/model-cache/torch
      XDG_CACHE_HOME: /app/model-cache
    volumes:
      - ./artifacts:/app/artifacts
      # SQLite WAL requires a Linux filesystem, not a Windows bind mount.
      - ingestion_ledger:/app/artifacts/ingestion/crawl
      - ./logs:/app/logs
      - model_cache:/app/model-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  # No code reads Postgres yet (audit H-2): it starts only on request,
  # `docker compose --profile postgres up`, and no longer blocks the stack.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lctrend}
      POSTGRES_USER: ${POSTGRES_USER:-lctrend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  model_cache:
  ingestion_ledger:
