[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lctrend"
version = "0.1.0"
description = "Ingestion and graph layer for weak technology signal discovery"
requires-python = ">=3.9"
dependencies = [
    "neo4j>=5.26,<6",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    # Lemma keys are part of concept identity in every extraction mode.
    "simplemma>=1.1,<2",
    # Async source connectors (OpenAlex, GitHub, PyPI, PDF downloads).
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
ner = ["gliner>=0.2.22,<1", "protobuf>=5,<7"]
llm = ["httpx>=0.27,<1"]
pdf = ["docling>=2,<3"]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
lctrend = "lctrend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lctrend = ["resources/*.json", "resources/*.cypher", "resources/prompts/*.txt"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
