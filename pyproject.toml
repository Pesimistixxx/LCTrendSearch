[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lctrend"
version = "0.1.0"
description = "Ingestion and graph layer for weak technology signal discovery"
requires-python = ">=3.9"
dependencies = [
    "neo4j>=5.26,<6",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    # Stems of Russian names are part of concept identity (key v2).
    "snowballstemmer>=2.2,<4",
    # Async source connectors (OpenAlex, GitHub, PyPI, PDF downloads).
    "httpx>=0.27,<1",
    # Taxonomy clustering over concept embeddings.
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
pdf = ["docling>=2,<3"]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
# signals-report --output *.xlsx
report = ["openpyxl>=3.1,<4"]
models = [
    "catboost>=1.2,<2",
    "torch>=2.4,<3",
    "torch-geometric>=2.7,<3",
    "scikit-learn>=1.5,<2",
]
# notebooks/: the modeling lab (export, labeling, dataset, training).
notebook = [
    "pandas>=2,<3",
    "matplotlib>=3.8,<4",
    "jupyterlab>=4,<5",
    # ipykernel 7.x hangs VS Code notebooks at "Connecting to kernel".
    "ipykernel>=6.29,<7",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16,<0.17",
    # tests/server exercises the FastAPI app, so dev needs the gui stack.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
lctrend = "lctrend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lctrend = ["resources/*.json", "resources/*.cypher", "resources/prompts/*.txt"]

[tool.ruff]
line-length = 79
target-version = "py39"
# research/ holds third-party reference notebooks, not project code.
extend-exclude = ["research"]

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "technology_triage: runs the technology triage call (tests/conftest.py)",
    "legacy_technology_entities: module predates the technology contract; the contract is reported, not enforced (tests/conftest.py)",
    "shipped_technology_contract: runs the technology contract as llm_schema.json ships it, enforced or not (tests/conftest.py)",
]
